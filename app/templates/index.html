<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum-Safe Encryption Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-4">Quantum-Safe Encryption Demo</h1>
            <p class="lead">Using Post-Quantum Cryptography with ML-KEM-512</p>
        </header>

        <div class="row g-4">
            <!-- Key Generation Section -->
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title">Key Generation</h2>
                        <button id="generateKeys" class="btn btn-primary">Generate New Key Pair</button>
                        <div id="keyDisplay" class="mt-3" style="display: none;">
                            <div class="form-group">
                                <label class="form-label">Public Key:</label>
                                <textarea id="publicKey" class="form-control" rows="2" readonly></textarea>
                            </div>
                            <div class="form-group mt-2">
                                <label class="form-label">Private Key:</label>
                                <textarea id="privateKey" class="form-control" rows="2" readonly></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Encryption Section -->
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="card-title">Encryption</h2>
                        <div class="form-group">
                            <label class="form-label">Message to Encrypt:</label>
                            <textarea id="messageToEncrypt" class="form-control" rows="3" placeholder="Enter your message here..."></textarea>
                        </div>
                        <button id="encryptMessage" class="btn btn-success mt-3">Encrypt Message</button>
                        <div id="encryptionResult" class="mt-3" style="display: none;">
                            <div class="form-group">
                                <label class="form-label">Encrypted Data:</label>
                                <textarea id="encryptedData" class="form-control" rows="3" readonly></textarea>
                            </div>
                            <div class="form-group mt-2">
                                <label class="form-label">KEM Ciphertext:</label>
                                <textarea id="kemCiphertext" class="form-control" rows="2" readonly></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Decryption Section -->
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="card-title">Decryption</h2>
                        <div class="form-group">
                            <label class="form-label">Encrypted Data:</label>
                            <textarea id="dataToDecrypt" class="form-control" rows="3" placeholder="Paste encrypted data here..."></textarea>
                        </div>
                        <div class="form-group mt-2">
                            <label class="form-label">KEM Ciphertext:</label>
                            <textarea id="kemCiphertextToDecrypt" class="form-control" rows="2" placeholder="Paste KEM ciphertext here..."></textarea>
                        </div>
                        <button id="decryptMessage" class="btn btn-info mt-3">Decrypt Message</button>
                        <div id="decryptionResult" class="mt-3" style="display: none;">
                            <div class="form-group">
                                <label class="form-label">Decrypted Message:</label>
                                <textarea id="decryptedMessage" class="form-control" rows="3" readonly></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Component -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="toast" class="toast align-items-center text-white bg-success" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='/js/main.js') }}"></script>
</body>
</html>
